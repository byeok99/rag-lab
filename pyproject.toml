[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tc-rag-cli"
version = "0.1.0"
description = "Evidence-first RAG CLI for test-case analysis and generation"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "xlrd>=2.0,<3"]

[project.scripts]
tc-rag = "tc_rag.cli:main"

[tool.setuptools.packages.find]
include = ["tc_rag*"]

